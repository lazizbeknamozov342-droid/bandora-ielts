const words = [
  {word:'Substantial',type:'adjective',meaning:'Large in amount, value, or importance.',example:'The city has made substantial investments in public transport.'},
  {word:'Mitigate',type:'verb',meaning:'To make something less severe, harmful, or serious.',example:'Governments can introduce policies to mitigate air pollution.'},
  {word:'Prevalent',type:'adjective',meaning:'Common or widespread in a particular place or group.',example:'Remote working has become increasingly prevalent.'},
  {word:'Allocate',type:'verb',meaning:'To distribute resources or duties for a particular purpose.',example:'More funding should be allocated to public education.'}
];
const readingPassage = `Urban green spaces, including parks, gardens and tree-lined streets, are increasingly viewed as essential components of modern cities. Beyond their aesthetic value, these spaces can help reduce the urban heat-island effect by providing shade and cooling the surrounding air. They also offer residents places to exercise, meet neighbours and spend time outdoors.\n\nHowever, access to green space is not always equal. In some cities, wealthier neighbourhoods have a greater number of well-maintained parks, while lower-income areas may have fewer trees and recreational facilities. Urban planners therefore face the challenge of expanding green infrastructure while ensuring that its benefits are shared fairly.\n\nCreating and maintaining public green spaces requires long-term investment. Local authorities must consider land availability, water use, maintenance costs and the needs of nearby communities. Some cities have responded by transforming unused plots into community gardens or creating small parks on previously neglected streets.`;
function heading(kicker,title,desc,extra=''){return `<div class="page-heading"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${extra}</div>`}

<section class="hero"><div class="hero-copy"><div class="hero-tag">✦ Your next chapter starts here</div><h2>Make your next IELTS band a reality.</h2><p>Practice with purpose. Strengthen all four skills, grow your vocabulary, and see how far you have come.</p><button class="btn btn-primary" data-go="reading">Start practicing&nbsp; →</button></div><div class="hero-art"><div class="circle">B.</div><small>100% free learning</small></div></section>

<section class="skill-grid">
${[['reading','▤','Reading','Build comprehension and question strategy.','60 min','#e8f0fb','#416b9a'],['listening','♫','Listening','Train your ear for detail and meaning.','15 min','#f9eee6','#a86d42'],['writing','✎','Writing','Develop clear, well-organised responses.','20 min','#f1eafb','#8060a5'],['speaking','◉','Speaking','Practice expressing ideas with confidence.','10 min','#e7f3ed','#39785e']].map(x=>`<article class="skill-card" data-go="${x[0]}"><div class="skill-icon" style="background:${x[5]};color:${x[6]}">${x[1]}</div><h4>${x[2]}</h4><p>${x[3]}</p><div class="skill-foot"><span>${x[4]} practice</span><b>Start →</b></div></article>`).join('')}

function reading(){return `${heading('SKILL PRACTICE','Reading practice','Read the passage and answer the questions. This is an original practice exercise.')}<div class="page-grid"><section class="practice-card"><div class="eyebrow">Academic reading · Short practice</div><h2>Urban green spaces</h2><p>Read the text carefully. Choose the best answer for each question.</p><div class="passage">${readingPassage}</div><div id="readingQuestions">
<div class="question"><strong>1. What is one environmental benefit of urban green spaces mentioned in the passage?</strong>${opts('q1',['They increase traffic flow','They help cool city areas','They reduce housing costs','They eliminate water use'])}</div>
<div class="question"><strong>2. What problem do urban planners need to address?</strong>${opts('q2',['Unequal access to green spaces','A lack of interest in city parks','The disappearance of all gardens','Too many community gardens'])}</div>

const academicPassages=[{"title": "The Return of Urban Wetlands", "text": "For much of the twentieth century, wetlands at the edges of expanding cities were treated as vacant land. Municipal authorities drained marshes to create sites for roads, housing and industry. The engineering was often celebrated as a triumph over an inconvenient landscape. Yet researchers now recognise that the apparent emptiness of wetlands concealed a complex system of ecological services.\n\nWetland soils act like sponges, absorbing rainfall and releasing it gradually. During heavy storms, this capacity can reduce the speed at which water enters drainage networks. Plants also trap sediments and absorb some nutrients carried by runoff. These processes do not make wetlands a substitute for every form of flood protection, but they can complement conventional infrastructure. Their effectiveness depends on location, size and the condition of the surrounding catchment.\n\nIn the coastal city of Meriton, planners initially proposed replacing an abandoned marsh with a paved recreational complex. A university team examined historical maps and discovered that the site had once connected two larger wetlands. Their models suggested that restoring this connection could provide temporary storage during storms. The council therefore postponed construction and commissioned a pilot restoration. Workers removed sections of a disused embankment, planted native reeds and installed instruments to monitor water levels.\n\nThe first two years produced encouraging but incomplete evidence. Sensors recorded slower water movement after several intense storms, while bird surveys documented an increase in visiting species. However, the researchers cautioned that short-term observations could not establish how the restored wetland would behave during an exceptionally rare flood. Nor could they isolate the restoration's effects from changes in rainfall elsewhere in the catchment.\n\nRestoration also raised social questions. Residents living near the marsh welcomed new walking routes, but some feared mosquitoes and the loss of parking spaces. Rather than dismissing these objections, the council organised workshops in which residents could review the monitoring results and propose modifications. The final design included raised paths and carefully located viewing platforms. Maintenance teams also committed to removing litter and checking blocked channels regularly.\n\nThe Meriton project illustrates a wider shift in urban planning. Instead of assuming that natural and engineered systems must compete, planners are beginning to examine how they can work together. Wetlands require land and long-term care; they cannot simply be installed like a pipe. Nevertheless, when ecological processes are understood and local concerns are addressed, restoration can become part of a city's practical response to environmental risk."}, {"title": "How Ancient Glass Travelled", "text": "Archaeologists once tended to interpret concentrations of ancient glass vessels as evidence that the communities in which they were found had manufactured them. This assumption was understandable: fragile objects seemed unlikely to survive long journeys. More recent investigations, however, have revealed a trading system in which raw glass, finished vessels and specialist craftspeople moved across considerable distances.\n\nGlass manufacture involved two activities that did not always occur in the same place. Primary workshops produced large quantities of raw glass by heating silica-rich sand with mineral additives. Secondary workshops reheated blocks of this material and shaped them into bottles, bowls or decorative objects. The distinction matters because a town containing many glass vessels may have supported skilled glassworkers without possessing the resources required for primary production.\n\nTo trace the movement of glass, researchers examine chemical signatures. Sand from different geological regions contains varying proportions of trace elements. Although recipes and recycling can complicate the evidence, carefully selected samples sometimes reveal groups of objects that probably originated from a shared source. Archaeologists compare these findings with shipwreck cargoes, workshop remains and written records of commerce.\n\nOne study of vessels recovered from inland settlements found that several pieces shared a chemical profile with raw glass produced near a distant coast. The result challenged the assumption that the settlements relied entirely on local materials. Yet the investigators were careful not to reconstruct a single uninterrupted trade route. Glass could have passed through several merchants, and a vessel might have been reshaped or sold more than once before reaching its final owner.\n\nRecycling presents a particular difficulty. Broken glass was valuable because remelting it required less preparation than producing new raw material. A workshop could mix fragments from several origins, creating an object with a blended chemical signature. Consequently, the absence of a clear match does not prove that a vessel was locally produced. Scholars increasingly combine laboratory results with evidence of manufacturing techniques and the contexts in which objects were buried.\n\nThese findings also alter how historians understand cultural exchange. The appearance of a fashionable vessel shape in a distant region does not necessarily show that people migrated there. Traders might have transported finished goods, while local craftspeople could have copied admired designs. Equally, travelling artisans may have introduced new techniques. The archaeological record often supports several plausible explanations, and distinguishing among them requires more than identifying similarities in appearance.\n\nAncient glass thus provides a lesson in historical reasoning. Scientific analysis can narrow the range of possibilities, but it rarely removes uncertainty altogether. The most persuasive accounts are those that explain both the material evidence and the limitations of what survives."}, {"title": "Why Some Forests Recover Slowly", "text": "When a forest is disturbed by fire, storms or logging, its recovery is often described as a return to the original condition. Ecologists increasingly question that description. Recovery is not a single process with a predictable endpoint; it involves interactions among soils, seeds, animals, climate and the history of disturbance. Two sites that look similar immediately after a disturbance may follow remarkably different trajectories.\n\nThe availability of seeds is one important factor. Some tree species maintain a reservoir of viable seeds in the soil, while others depend on seeds carried from surviving stands. In a small clearing surrounded by mature forest, birds and wind may bring sufficient seeds for regeneration. Across a much larger disturbed area, however, the centre may be too distant from seed sources. Even if soil conditions are favourable, the composition of the new forest can differ from that of the former one.\n\nSoil organisms also influence recovery. Fungi associated with tree roots can improve the uptake of water and nutrients, but intense disturbances may alter the communities of microorganisms present. Researchers have found that planting seedlings does not always overcome this problem: young trees may survive initially yet grow poorly when the soil community is unsuitable. This has encouraged experiments in which restoration teams protect remaining patches of undisturbed soil rather than treating the ground as an inert surface.\n\nClimate adds another layer of uncertainty. A species that established successfully under historical temperature and rainfall patterns may struggle under warmer or drier conditions. Some ecologists therefore argue that restoration targets should emphasise ecological functions, such as maintaining shade and preventing erosion, rather than reproducing an exact historical list of species. Critics worry that this approach could be used to justify abandoning threatened native plants too quickly.\n\nLong-term monitoring is essential because early success can be misleading. Rapid growth by a few pioneer species may produce a dense canopy within a decade, while slower-growing trees remain absent. Conversely, a site that initially appears sparse may gradually develop greater diversity as animals return and disperse seeds. Measurements taken over only two or three seasons may capture weather fluctuations rather than a durable trend.\n\nA collaborative project in the fictional Vale Ridge region illustrates these challenges. Teams compared plots that were left to regenerate naturally with plots receiving carefully selected seedlings. After five years, planted plots had more young trees, but the naturally regenerating plots supported a wider variety of shrubs. Neither outcome alone established which approach would provide a more resilient forest decades later. Researchers therefore extended the study and added measurements of soil moisture, insect communities and canopy structure.\n\nThe central lesson is not that restoration is futile, but that success needs to be defined with care. A healthy recovering forest may not look exactly like the forest that preceded it. Effective management combines ecological knowledge, transparent goals and the willingness to revise decisions as new evidence appears."}];

ng?", "options": null, "answer": "parking spaces"}, {"type": "short", "prompt": "What did the council arrange so residents could discuss the project?", "options": null, "answer": "workshops"}, {"type": "tf", "prompt": "Primary and secondary glass workshops always operated at the same location.", "options": null, "answer": "FALSE"}, {"type": "tf", "prompt": "Trace elements in sand can help identify possible sources of glass.", "options": null, "answer": "TRUE"}, {"type": "tf", "prompt": "Researchers reconstructed a single confirmed route for the inland vessels.", "options": null, "answer": "FALSE"}, {"type": "tf", "prompt": "Remelting broken glass could be advantageous for workshops.", "options": null, "answer": "TRUE"}, {"type": "tf", "prompt": "All glass found in inland settlements was imported.", "options": null, "answer": "NOT GIVEN"}, {"type": "mc", "prompt": "Why is the primary/secondary workshop distinction important?", "options": ["It proves all vessels were exported", "Vessels may be shaped where raw glass was not produced", "Only primary workshops recycled glass", "It shows glass was never traded"], "answer": 1}, {"type": "mc", "prompt": "What can complicate chemical identification?", "options": ["Only the age of an object", "Its colour alone", "Mixing recycled fragments", "The number of excavators"], "answer": 2}, {"type": "mc", "prompt": "What might explain a fashionable shape appearing far from its origin?", "options": ["Only mass migration", "Only a local invention", "Only shipwrecks", "Trade, imitation or travelling artisans"], "answer": 3}, {"type": "mc", "prompt": "What is the main purpose of the final paragraph?", "options": ["To claim certainty", "To stress both the value and limits of scientific evidence", "To reject laboratory methods", "To date all vessels"], "answer": 1}, {"type": "short", "prompt": "What type of cargo can provide evidence of glass trade?", "options": null, "answer": "shipwreck"}, {"type": "short", "prompt": "What were raw glass blocks reheated into, among other objects?", "options": null, "answer": "bottles"}, {"type": "short", "prompt": "Which substances in sand provide chemical clues?", "options": null, "answer": "trace elements"}, {"type": "short", "prompt": "What could be copied by local craftspeople?", "options": null, "answer": "designs"}, {"type": "tf", "prompt": "All disturbed forests recover along the same trajectory.", "options": null, "answer": "FALSE"}, {"type": "tf", "prompt": "Seed availability may affect the species present in a regenerating forest.", "options": null, "answer": "TRUE"}, {"type": "tf", "prompt": "Planting seedlings always solves problems with soil microorganisms.", "options": null, "answer": "FALSE"}, {"type": "tf", "prompt": "Some researchers propose focusing on ecological functions.", "options": null, "answer": "TRUE"}, {"type": "tf", "prompt": "The Vale Ridge study lasted twenty years before its first report.", "options": null, "answer": "NOT GIVEN"}, {"type": "mc", "prompt": "Why may the centre of a large disturbed area regenerate differently?", "options": ["It has too much shade", "It is far from surviving seed sources", "It is always wetter", "It has no soil"], "answer": 1}, {"type": "mc", "prompt": "What do critics fear about function-based restoration targets?", "options": ["They will increase rainfall", "They will prevent erosion", "They may encourage premature abandonment of native species", "They will eliminate monitoring"], "answer": 2}, {"type": "mc", "prompt": "Why can early canopy growth be misleading?", "options": ["It guarantees full recovery", "It prevents all animal return", "It proves the soil is undisturbed", "Slow-growing tree species may still be missing"], "answer": 3}, {"type": "mc", "prompt": "What did Vale Ridge researchers decide?", "options": ["End the study", "Extend monitoring and measure additional factors", "Plant only shrubs", "Remove all planted trees"], "answer": 1}, {"type": "short", "prompt": "What organisms associated with roots help trees absorb nutrients?", "options": null, "answer": "fungi"}, {"type": "short", "prompt": "What can birds and wind transport into clearings?", "options": null, "answer": "seeds"}, {"type": "short", "prompt": "What kind of species may quickly form a canopy?", "options": null, "answer": "pioneer"}, {"type": "short", "prompt": "What soil characteristic did the Vale Ridge team add to its measurements?", "options": null, "answer": "moisture"}];

{title:'Section 1 — Community Learning Centre',kind:'Conversation',script:`Receptionist: Good morning, Westbridge Learning Centre. How may I help?\nStudent: Hello. I'd like to reserve a study room for a group project.\nReceptionist: Certainly. Could I have your surname?\nStudent: It's Patel. P A T E L.\nReceptionist: Thank you. Which day would you like?\nStudent: Thursday, please. Actually, our teacher moved the deadline, so Friday would be better.\nReceptionist: Friday it is. What time would you like to begin?\nStudent: Half past three in the afternoon.\nReceptionist: We have Room 6 available then. It seats eight people.\nStudent: Perfect. There will be six of us.\nReceptionist: You can use the room for two hours. Please collect the key at reception.\nStudent: Is there a fee?\nReceptionist: No, but we ask for a refundable deposit of ten pounds.\nStudent: Great, thank you.`,qs:[['Surname of student','patel'],['Final day requested','friday'],['Start time (e.g. 3:30)','3:30'],['Room number','6'],['Number of students','6'],['Maximum booking length (hours)','2'],['Deposit (£)','10'],['Where to collect the key','reception'],['Original day requested','thursday'],['Type of project','group']]},
{title:'Section 2 — Museum Visitor Information',kind:'Monologue',script:`Welcome to the Riverside Museum. Before you explore, I have a few practical details. The museum opens at nine thirty each morning and closes at five. Our newest exhibition, Mapping the River, is on the second floor. Visitors can reach it by the lift near the café. Photography is permitted in most galleries, but please do not use flash. Our guided tour begins at eleven fifteen in the main hall and lasts forty-five minutes. The tour is free, although places are limited to twenty visitors. The museum café serves lunch from noon, and the shop sells a guidebook for twelve pounds. If you have children with you, ask at the information desk for our free activity sheets. Finally, remember that the east entrance is closed for repairs. Please use the west entrance when leaving the building.`,qs:[['Opening time','9:30'],['Closing time','5'],['Floor of new exhibition','second'],['Location of lift','cafe'],['Photography restriction','flash'],['Guided tour start','11:15'],['Tour duration in minutes','45'],['Maximum tour visitors','20'],['Guidebook price (£)','12'],['Entrance to use','west']]}

const eqAnswer=(v,key)=>{let a=normAnswer(v),b=normAnswer(key);if(key==='3:30')return ['330','3:30','half past three','1530','15:30'].some(x=>normAnswer(x)===a);if(key==='9:30')return ['930','9:30','half past nine'].some(x=>normAnswer(x)===a);if(key==='11:15')return ['1115','11:15','quarter past eleven'].some(x=>normAnswer(x)===a);return a===b|| (key==='cafe'&&a==='café')||(key==='group'&&a==='group project')||(key==='second'&&a==='2')};
function reading(){return `${heading('ACADEMIC PRACTICE','IELTS-style Reading','Three original academic texts · 40 questions · 60 minutes')}<div class="exam-bar"><span>READING TEST 01</span><strong id="readingClock">60:00</strong><span id="readingCount">0 / 40 answered</span></div><div class="exam-tabs">${academicPassages.map((p,i)=>`<button class="exam-tab ${i===readingTab?'selected':''}" data-passage="${i}">Passage ${i+1} <small>${i===0?'1–14':i===1?'15–27':'28–40'}</small></button>`).join('')}</div><div class="exam-layout"><article class="exam-passage"><div class="eyebrow">READING PASSAGE ${readingTab+1}</div><h2>${academicPassages[readingTab].title}</h2><p class="exam-instruction">You should spend about 20 minutes on Questions ${readingTab===0?'1–14':readingTab===1?'15–27':'28–40'}.</p>${academicPassages[readingTab].text.split('\n\n').map(p=>`<p>${p}</p>`).join('')}</article><section class="exam-questions"><div class="eyebrow">QUESTIONS</div><h2>Answer the questions</h2><p class="exam-instruction">For TRUE / FALSE / NOT GIVEN, select whether the statement agrees with the passage. For short answers, write NO MORE THAN TWO WORDS AND/OR A NUMBER.</p>${academicQuestions.map((q,i)=>({q,i})).filter(({i})=>readingTab===0?i<14:readingTab===1?i>=14&&i<27:i>=27).map(({q,i})=>`<div class="exam-question"><strong>${i+1}. ${q.prompt}</strong>${q.type==='short'?`<input class="field exam-input" data-rq="${i}" value="${readingAnswers[i]||''}" placeholder="Type your answer" ${readingFinished?'disabled':''}>`:(q.type==='tf'?['TRUE','FALSE','NOT GIVEN']:q.options).map((o,j)=>`<label class="exam-option"><input type="radio" name="rq${i}" data-rq="${i}" value="${q.type==='tf'?o:j}" ${String(readingAnswers[i])===String(q.type==='tf'?o:j)?'checked':''} ${readingFinished?'disabled':''}> <span>${q.type==='mc'?String.fromCharCode(65+j)+'. ':''}${o}</span></label>`).join('')}</div>`).join('')}<div class="exam-controls"><button class="btn btn-light" id="prevPassage" ${readingTab===0?'disabled':''}>← Previous</button><button class="btn btn-light" id="nextPassage" ${readingTab===2?'disabled':''}>Next passage →</button><button class="btn btn-primary" id="finishReading">${readingFinished?'View results':'Submit test'}</button></div><div id="readingResult"></div></section></div>`}
function readingScore(){let score=0;let detail=[];academicQuestions.forEach((q,i)=>{const good=q.type==='short'?eqAnswer(readingAnswers[i],q.answer):String(readingAnswers[i])===String(q.answer);if(good)score++;detail.push(`<div class="review-row"><b>${i+1}.</b> ${good?'✓':'✗'} Your answer: ${String(readingAnswers[i]??'—').replace(/[<>&]/g,'')} · Correct: <b>${q.type==='mc'?q.options[q.answer]:q.answer}</b></div>`)});let band=score>=39?'9':score>=37?'8.5':score>=35?'8':score>=33?'7.5':score>=30?'7':score>=27?'6.5':score>=23?'6':score>=19?'5.5':score>=15?'5':'Below 5';document.getElementById('readingResult').innerHTML=`<div class="result"><strong>${score}/40 correct</strong> · Approximate Academic Reading band ${band} (unofficial estimate).<details><summary>Review all 40 answers</summary>${detail.join('')}</details></div>`}
function bindReading(){document.querySelectorAll('[data-passage]').forEach(b=>b.onclick=()=>{readingTab=+b.dataset.passage;render('reading')});document.querySelectorAll('[data-rq]').forEach(e=>e.onchange=()=>{readingAnswers[e.dataset.rq]=e.value;document.getElementById('readingCount').textContent=Object.values(readingAnswers).filter(v=>String(v).trim()).length+' / 40 answered'});document.getElementById('prevPassage').onclick=()=>{readingTab--;render('reading')};document.getElementById('nextPassage').onclick=()=>{readingTab++;render('reading')};document.getElementById('finishReading').onclick=()=>{if(!readingFinished){if(!confirm('Submit your Reading test? You will not be able to change answers.'))return;readingFinished=true;saveStat('sessions')}readingScore()};if(!readingEnd)readingEnd=Date.now()+3600000;if(readingTicker)clearInterval(readingTicker);const tick=()=>{const el=document.getElementById('readingClock');if(!el)return;let t=Math.max(0,Math.ceil((readingEnd-Date.now())/1000));el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(!t&&!readingFinished){readingFinished=true;saveStat('sessions');readingScore()}};tick();readingTicker=setInterval(tick,1000);document.getElementById('readingCount').textContent=Object.values(readingAnswers).filter(v=>String(v).trim()).length+' / 40 answered';if(readingFinished)readingScore()}
function listening(){let sec=listenSections[listeningSection];return `${heading('LISTENING PRACTICE','IELTS-style Listening','Original English recordings generated by your browser · 20 questions')}<div class="exam-bar"><span>LISTENING PRACTICE 01</span><strong>2 SECTIONS</strong><span>${Object.values(listeningAnswers).filter(Boolean).length} / 20 answered</span></div><div class="exam-tabs">${listenSections.map((s,i)=>`<button class="exam-tab ${listeningSection===i?'selected':''}" data-lsec="${i}">Section ${i+1} <small>Questions ${i*10+1}–${i*10+10}</small></button>`).join('')}</div><div class="practice-card"><div class="eyebrow">${sec.kind} · Questions ${listeningSection*10+1}–${listeningSection*10+10}</div><h2>${sec.title}</h2><p>Listen and complete the notes. Write NO MORE THAN TWO WORDS AND/OR A NUMBER. Use the audio controls below.</p><div class="audio-panel"><button class="btn btn-primary" id="playListen">▶ Play recording</button><button class="btn btn-light" id="stopListen">■ Stop</button><span id="audioStatus">Ready · English voice</span></div><div class="notice">This practice uses your device's speech-synthesis voice, not a studio-recorded IELTS audio track. If no English voice is installed, playback may vary by browser.</div>${sec.qs.map((q,i)=>`<div class="exam-question"><strong>${listeningSection*10+i+1}. ${q[0]}</strong><input class="field exam-input" data-lq="${listeningSection*10+i}" placeholder="Your answer" value="${listeningAnswers[listeningSection*10+i]||''}"></div>`).join('')}<div class="exam-controls"><button class="btn btn-light" id="nextListen">${listeningSection?'← Section 1':'Section 2 →'}</button><button class="btn btn-primary" id="submitListening">Check all answers</button></div><div id="listeningResult"></div><details class="transcript"><summary>Show transcript (after listening)</summary><p>${sec.script.replace(/\\n/g,'<br>')}</p></details></div>`}
function bindListening(){document.querySelectorAll('[data-lsec]').forEach(b=>b.onclick=()=>{speechSynthesis.cancel();listeningSection=+b.dataset.lsec;render('listening')});document.querySelectorAll('[data-lq]').forEach(e=>e.oninput=()=>listeningAnswers[e.dataset.lq]=e.value);document.getElementById('nextListen').onclick=()=>{speechSynthesis.cancel();listeningSection=1-listeningSection;render('listening')};document.getElementById('playListen').onclick=()=>{if(!('speechSynthesis' in window)){document.getElementById('audioStatus').textContent='Audio is not supported in this browser';return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(listenSections[listeningSection].script.replace(/\\n/g,' '));utter.lang='en-GB';utter.rate=.87;const voices=speechSynthesis.getVoices();utter.voice=voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang.startsWith('en'))||null;utter.onstart=()=>document.getElementById('audioStatus')&&(document.getElementById('audioStatus').textContent='Playing…');utter.onend=()=>document.getElementById('audioStatus')&&(document.getElementById('audioStatus').textContent='Finished');listeningUtterance=utter;speechSynthesis.speak(utter)};document.getElementById('stopListen').onclick=()=>{speechSynthesis.cancel();document.getElementById('audioStatus').textContent='Stopped'};document.getElementById('submitListening').onclick=()=>{let score=0;let rows=[];listenSections.forEach((s,si)=>s.qs.forEach((q,i)=>{let n=si*10+i,correct=eqAnswer(listeningAnswers[n],q[1]);if(correct)score++;rows.push(`<div class="review-row">${n+1}. ${correct?'✓':'✗'} Correct: <b>${q[1]}</b></div>`)}));document.getElementById('listeningResult').innerHTML=`<div class="result"><strong>${score}/20 correct</strong> · Practice score (not an official IELTS band).<details><summary>Review answers</summary>${rows.join('')}</details></div>`;saveStat('sessions')}}
const previousBindPage=bindPageOriginal;
bindPage=function(page){if(page==='reading'){bindReading();return}if(page==='listening'){bindListening();return}previousBindPage(page)};

const pages={dashboard,reading,listening,writing,speaking,vocabulary,mock};
function render(page='dashboard'){if(!pages[page])page='dashboard';content.innerHTML=pages[page]();pageCrumb.textContent=page==='dashboard'?'Overview':page[0].toUpperCase()+page.slice(1);navItems.forEach(n=>n.classList.toggle('active',n.dataset.page===page));bindPage(page);window.scrollTo(0,0)}
function bindPageOriginal(page){
 if(page==='reading'){document.getElementById('submitReading').onclick=()=>{const key={q1:1,q2:0,q3:2};let score=0;Object.entries(key).forEach(([q,a])=>{if(document.querySelector(`input[name="${q}"]:checked`)?.value==a)score++});document.getElementById('readingResult').innerHTML=`<div class="result">You scored <strong>${score}/3</strong>. ${score===3?'Excellent work!':'Review the passage and try again.'} This is a practice score, not an IELTS band.</div>`;saveStat('sessions')}}
 if(page==='listening'){document.getElementById('submitListening').onclick=()=>document.getElementById('listeningResult').innerHTML='<div class="result">The demo audio is a placeholder, so this activity cannot be marked yet. We will add an original recording and answer key next.</div>'}
 if(page==='writing'){const ta=document.getElementById('essay');ta.oninput=()=>{const count=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;document.getElementById('wordCount').textContent=count+' words'};document.getElementById('reviewEssay').onclick=()=>{const text=ta.value.trim(),count=text?text.split(/\s+/).length:0;document.getElementById('essayResult').innerHTML=`<div class="result"><strong>Writing self-review</strong><br>Word count: ${count}. ${count<250?'Your response is below the suggested 250-word minimum.':'You have reached the suggested minimum length.'}<br><br>Before finishing, check: Have you answered every part of the question? Is your position clear? Does each body paragraph develop one main idea? Have you checked grammar, spelling and punctuation?</div>`}}
 if(page==='vocabulary'){document.getElementById('revealWord').onclick=()=>{revealed=!revealed;render('vocabulary')};document.getElementById('nextWord').onclick=()=>{vocabIndex=(vocabIndex+1)%words.length;revealed=false;render('vocabulary')}}
 if(page==='speaking'){let recorder=null,stream=null;document.getElementById('recordBtn').onclick=async()=>{const b=document.getElementById('recordBtn'),s=document.getElementById('speakingStatus');try{if(!recorder||recorder.state==='inactive'){stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recorder.start();b.textContent='■ Stop recording';s.textContent='Recording in progress...';recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());s.textContent='Recording stopped. Your audio was not uploaded.'}}else{recorder.stop();b.textContent='● Start recording'}}catch(e){s.textContent='Microphone access was not available. Check your browser permissions.'}};document.getElementById('prepTimer').onclick=()=>{let n=60;const b=document.getElementById('prepTimer');b.disabled=true;const t=setInterval(()=>{n--;b.textContent=`Preparation: ${n}s`;if(n<=0){clearInterval(t);b.textContent='Preparation complete';b.disabled=false}},1000)}}
}
function saveStat(k){const key='bandora_'+k;try{localStorage.setItem(key,String(Number(localStorage.getItem(key)||0)+1))}catch(e){}updateStats()}
function safeGet(key){try{return localStorage.getItem(key)||'0'}catch(e){return '0'}}
function updateStats(){document.getElementById('sessionsStat')&&(document.getElementById('sessionsStat').textContent=safeGet('bandora_sessions'));document.getElementById('wordsStat')&&(document.getElementById('wordsStat').textContent=safeGet('bandora_words'));document.getElementById('mockStat')&&(document.getElementById('mockStat').textContent=safeGet('bandora_mock'))}
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go)render(go.dataset.go);const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();render(nav.dataset.page);document.getElementById('sidebar').classList.remove('open')}});
document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
render();updateStats();

</script>
</body>
</html>
